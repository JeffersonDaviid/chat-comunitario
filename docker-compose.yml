services:
  postgres:
    image: postgres:16-alpine
    container_name: chatcomunitario-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatcomunitario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatcomunitario-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  chatcomunitario-network:
    driver: bridge
