services:
  postgres:
    image: postgres:16-alpine
    container_name: chatcomunitario
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatcomunitario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatcomunitario-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  api-chatcomunitario:
    build:
      context: ./backend-dotnet
      dockerfile: Dockerfile
    container_name: api-chatcomunitario
    hostname: api-chatcomunitario
    ports:
      - '5000:8080' # HTTPS externo
    depends_on:
      - postgres
    networks:
      - chatcomunitario-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  chatcomunitario-network:
    driver: bridge
